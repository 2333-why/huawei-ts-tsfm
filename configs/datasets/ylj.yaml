schema_version: 1
dataset: YLJParquet
paths:
  parquet_file: /data/PVMMoE/DATA/01-Solar/YLJ/Benchmark/YLJ-Unified_format.parquet
  checkpoints_root: ./checkpoints_ylj
  results_root: ./results_ylj
  logs_root: ./logs_ylj
  teacher_checkpoint: ./checkpoints_ylj/teacher/checkpoint.pth
  student_checkpoint: ./checkpoints_ylj/student/checkpoint.pth
fields:
  timestamp: timestamp
  target: observe_power
  time_series_columns:
    - observe_power
    - GHI_observe
    - TEMP_observe
    - WS_observe
    - WD_observe
    - PREC_observe
    - PWAT_observe
    - SDWE_observe
    - GHI_forecast_1day
    - TEMP_forecast_1day
    - WS_forecast_1day
    - WD_forecast_1day
    - PREC_forecast_1day
    - PWAT_forecast_1day
    - SDWE_forecast_1day
    - GHI_forecast_4hour
    - TEMP_forecast_4hour
    - WS_forecast_4hour
    - WD_forecast_4hour
    - PREC_forecast_4hour
    - PWAT_forecast_4hour
    - SDWE_forecast_4hour
  history_columns:
    - observe_power
    - GHI_observe
    - TEMP_observe
    - WS_observe
    - WD_observe
    - PREC_observe
    - PWAT_observe
    - SDWE_observe
  forecast_window_columns:
    - GHI_forecast_1day
    - TEMP_forecast_1day
    - WS_forecast_1day
    - WD_forecast_1day
    - PREC_forecast_1day
    - PWAT_forecast_1day
    - SDWE_forecast_1day
    - GHI_forecast_4hour
    - TEMP_forecast_4hour
    - WS_forecast_4hour
    - WD_forecast_4hour
    - PREC_forecast_4hour
    - PWAT_forecast_4hour
    - SDWE_forecast_4hour
  time_series_scale_factors:
    PWAT_observe: 0.1
    PWAT_forecast_1day: 0.1
    PWAT_forecast_4hour: 0.1
  forecast_fallbacks:
    GHI_forecast_1day: {alternative: GHI_forecast_4hour, persistence: GHI_observe}
    TEMP_forecast_1day: {alternative: TEMP_forecast_4hour, persistence: TEMP_observe}
    WS_forecast_1day: {alternative: WS_forecast_4hour, persistence: WS_observe}
    WD_forecast_1day: {alternative: WD_forecast_4hour, persistence: WD_observe}
    PREC_forecast_1day: {alternative: PREC_forecast_4hour, persistence: PREC_observe}
    PWAT_forecast_1day: {alternative: PWAT_forecast_4hour, persistence: PWAT_observe}
    SDWE_forecast_1day: {alternative: SDWE_forecast_4hour, persistence: SDWE_observe}
    GHI_forecast_4hour: {alternative: GHI_forecast_1day, persistence: GHI_observe}
    TEMP_forecast_4hour: {alternative: TEMP_forecast_1day, persistence: TEMP_observe}
    WS_forecast_4hour: {alternative: WS_forecast_1day, persistence: WS_observe}
    WD_forecast_4hour: {alternative: WD_forecast_1day, persistence: WD_observe}
    PREC_forecast_4hour: {alternative: PREC_forecast_1day, persistence: PREC_observe}
    PWAT_forecast_4hour: {alternative: PWAT_forecast_1day, persistence: PWAT_observe}
    SDWE_forecast_4hour: {alternative: SDWE_forecast_1day, persistence: SDWE_observe}
dimensions:
  time_series_input_dim: 22
  history_points: 16
  forecast_steps: 16
  target_dim: 1
  image_history_frames: 16
  image_channels: 3
  image_height: 64
  image_width: 64
  weather_placeholder_dim: 7
privileged_teacher:
  enabled: true
  future_timeseries_columns:
    - GHI_observe
    - TEMP_observe
    - WS_observe
    - WD_observe
    - PREC_observe
    - PWAT_observe
    - SDWE_observe
  future_images_enabled: false
  exclude_target_from_inputs: true
time:
  sampling_interval_minutes: 15
  forecast_step_minutes: 15
  forecast_horizon_minutes: 240
  forecast_window_shift_minutes: 240
  evaluation_horizons_minutes: [15, 240]
  history_order: past_first
  train_start_timestamp: '2024-01-01 00:00:00'
  test_start_timestamp: '2025-01-01 00:00:00'
  test_end_exclusive_timestamp: '2025-06-01 00:00:00'
  validation_fraction: 0.15
power:
  power_scale: 468.0
  max_power: 468.0
  rated_power: 468.0
  units: MW
  model_input_normalization: divide_by_power_scale
  target_floor: 0.0
  allow_missing_target: true
  hard_delta_fraction: 0.10
  direction_min_delta_fraction: 0.02
images:
  images_enabled: false
  pad_value: 0.0
missing:
  history_fill: causal_forward_fill_then_train_mean
  forecast_fill: paired_product_then_issue_time_persistence_then_train_mean
  normalization: train_zscore
  normalization_epsilon: 1.0e-6
runtime:
  gpu_devices: 0,1,2,3,4,5,6,7
  precision: fp16
  num_workers: 16
  prefetch_factor: 2
  pin_memory: true
  teacher_batch_size: 64
  student_batch_size: 64
  teacher_epochs: 40
  student_epochs: 40
  patience: 10
  learning_rate: 0.0001
monitoring:
  enabled: true
  level: standard
  aggregate_only: true
  epoch_interval: 1
  gradient_interval_steps: 50
  min_slice_count: 100
  min_slice_days: 5
  include_test_during_training: false
  save_raw_predictions: false
  heavy_diagnostics: [initial, best, final]
model:
  d_model: 512
  n_heads: 8
  e_layers: 2
  d_layers: 1
  d_ff: 2048
  factor: 3
  image_encoder_type: cnn
  image_cnn_dim: 64
  image_temporal_hidden_dim: 64
  teacher_fuse_strategy: no_img
  student_fuse_strategy: ts_only
  kd_type: inter_causal
  kd_similarity_weight: 0.001
  kd_intervention_weight: 0.1
  kd_intervention_min_feature_delta: 1.0e-8
  modality_dropout_rate: 0.0
output:
  predictions_file: official_test_predictions.csv
  metrics_file: official_test_metrics.json
